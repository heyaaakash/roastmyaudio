[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roastmyaudio"
dynamic = ["version"]
description = "Open-source, fully local speech-to-text for macOS menu bar and web browser"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aakash"}
]
maintainers = [
    {name = "Aakash"}
]
requires-python = ">=3.10"
keywords = [
    "whisper",
    "speech-to-text",
    "dictation",
    "macos",
    "open-source",
    "privacy",
    "local-ai",
    "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Japanese",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]

dependencies = [
    "faster-whisper>=1.1,<2",
    "av>=11,<19",
    "filelock>=3.10,<5",
    "numpy>=1.24,<3",
    "scipy>=1.11,<2",
    "Flask>=3.0,<4",
    "sounddevice>=0.5,<1",
    "huggingface-hub>=0.23,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
macos = [
    "PyObjC-core>=10; sys_platform == 'darwin'",
    "PyObjC-framework-Cocoa>=10; sys_platform == 'darwin'",
    "PyObjC-framework-Quartz>=10; sys_platform == 'darwin'",
    "PyObjC-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "PyObjC-framework-AVFoundation>=10; sys_platform == 'darwin'",
    "PyObjC-framework-ServiceManagement>=10; sys_platform == 'darwin'",
    "PyObjC-framework-WebKit>=10; sys_platform == 'darwin'",
    "rumps>=0.4; sys_platform == 'darwin'",
    "pynput>=1.7.7; sys_platform == 'darwin'",
]
bundle = ["pyinstaller>=6.17,<7"]
cleanup = ["llama-cpp-python>=0.2.90,<1"]
dev = ["ruff>=0.4", "pytest>=8", "pytest-mock>=3.12", "build>=1", "setuptools>=68", "wheel"]

[tool.setuptools]
packages = {find = {include = ["src*", "config*"]}}

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.package-data]
"src.apps.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[project.urls]
Homepage = "https://github.com/heyaaakash/roastmyaudio"
Repository = "https://github.com/heyaaakash/roastmyaudio.git"
Documentation = "https://github.com/heyaaakash/roastmyaudio/tree/main/docs"
Issues = "https://github.com/heyaaakash/roastmyaudio/issues"
Changelog = "https://github.com/heyaaakash/roastmyaudio/blob/main/CHANGELOG.md"

# ── Ruff linter configuration ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments
    "UP007",  # X | Y union syntax (keep 3.9 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "src"]

# ── Pytest configuration ──────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
